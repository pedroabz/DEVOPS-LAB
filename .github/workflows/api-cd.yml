name: api-cd

# Tests -> migrations -> deploy. Nothing here touches iac/ — infrastructure has its own
# pipeline (PRD M7/M8). This one ships the application onto infrastructure that already exists.

on:
  push:
    branches: [main]
    # Explicit rather than 'src/**': the BFF and the SPA now live under src/ too, and a CSS
    # tweak has no business running database migrations or opening a SQL firewall hole.
    # `paths` and `paths-ignore` cannot be combined, so the list has to be enumerated.
    # Trade-off: a NEW project under src/ will not trigger this until someone adds it here.
    paths:
      - 'src/orders-api/**'
      - 'src/shared/**'
      - 'tests/DevOpsLab.Api.Tests/**'
      - '.github/workflows/api-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write # mints the OIDC token for azure/login
  contents: read

# Two runs must never migrate the same database at once. Queue rather than cancel:
# cancelling mid-migration leaves the schema in an unknown state.
concurrency:
  group: api-cd
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  # Duplicated from iac/main.bicep. Deliberate: reading them from deployment outputs
  # would be DRYer but adds a lookup step and a failure mode for very little gain at
  # this size. If you rename a resource, change it here too.
  RESOURCE_GROUP: rg-devopslab-dev-spc
  SQL_SERVER: sql-devopslab-dev-spc-pabz
  SQL_DATABASE: sqldb-orders-dev
  WEBAPP_NAME: app-devopslab-dev-spc-pabz

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always() # test results are most useful when the run failed
        with:
          name: test-results
          path: TestResults

  migrate:
    name: Apply migrations
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Jobs do not share a filesystem, so the restore in `test` does not help here.
      # Build before opening the firewall: a compile error should fail fast, not while
      # a hole is open in the firewall.
      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The SQL firewall allows Pedro's home IP and the snet-app subnet. A GitHub-hosted
      # runner is neither, so it opens a hole for itself and closes it again below.
      - name: Sweep any firewall rules left behind by a killed run
        run: |
          az sql server firewall-rule list \
            -g "$RESOURCE_GROUP" -s "$SQL_SERVER" \
            --query "[?starts_with(name, 'gh-runner-')].name" -o tsv \
          | while read -r stale; do
              echo "Removing stale rule: $stale"
              az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$stale"
            done

      - name: Open the firewall for this runner
        id: firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          RULE_NAME="gh-runner-${{ github.run_id }}"
          echo "rule-name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" --output none
          echo "Opened $RULE_NAME for $RUNNER_IP"

      # OrdersDbContextFactory reads this variable. No password: the runner authenticates
      # as sp-devopslab-github-dev, which is a member of sg-devopslab-sql-admins.
      - name: dotnet ef database update
        env:
          ORDERS_CONNECTION_STRING: "Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=90;"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          # --no-build so this step cannot fail for compile reasons; the build above owns
          # that. The only retry-worthy failure left is a serverless auto-pause resume,
          # which takes 30-60s and usually times out rather than waiting.
          dotnet ef database update --project src/orders-api/DevOpsLab.Infrastructure \
              --no-build --configuration Release \
            || dotnet ef database update --project src/orders-api/DevOpsLab.Infrastructure \
              --no-build --configuration Release

      - name: Close the firewall
        if: always() # must run even when the migration failed
        run: |
          az sql server firewall-rule delete \
            -g "$RESOURCE_GROUP" -s "$SQL_SERVER" \
            -n "${{ steps.firewall.outputs.rule-name }}" --output none || true
          echo "Removed ${{ steps.firewall.outputs.rule-name }}"

  deploy:
    name: Deploy to App Service
    needs: migrate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet publish src/orders-api/DevOpsLab.Api --configuration Release --output publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: publish

      # Liveness runs no checks, so this proves the process started, not that SQL works.
      # Readiness is deliberately not asserted here: the database may be resuming, and a
      # 60s timeout on a paused database is expected behaviour, not a deployment failure.
      #
      # A cold App Service serves 404 from its default handler until the app is warm,
      # which took over 75s on the first deploy to a brand new plan. 404 and 503 are
      # therefore "not ready yet", not failure. Only the clock decides.
      - name: Smoke test
        timeout-minutes: 6
        run: |
          DEADLINE=$((SECONDS + 300))
          ATTEMPT=0
          while [ $SECONDS -lt $DEADLINE ]; do
            ATTEMPT=$((ATTEMPT + 1))
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/health/live") || true
            echo "attempt $ATTEMPT ($((SECONDS))s): HTTP $CODE"
            case "$CODE" in
              200) echo "Live."; exit 0 ;;
              404|503|000) sleep 10 ;;               # still starting
              *) echo "::error::Unexpected status $CODE"; exit 1 ;;
            esac
          done
          echo "::error::Liveness never returned 200 within 5 minutes"
          exit 1
